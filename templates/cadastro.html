<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Pyoneiro</title>
</head>

<body>

    <h1>Criar conta</h1>

    {% if mensagem %}
    <p>{{ mensagem }}</p>
{% endif %}

    <form method="POST" action="/cadastro">
        <label>Nome:</label>
        <input type="text" name="nome">

        <br><br>

        <label>E-mail:</label>
        <input type="email" name="email">

        <br><br>

        <label>Senha:</label>
        <input type="password" name="senha">

        <br><br>

        <button type="submit">Cadastrar</button>
    </form>

</body>
</html>
