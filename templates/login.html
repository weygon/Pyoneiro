<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login - Pyoneiro</title>
</head>

<body>

    <h1>Entrar</h1>
    
    {% if mensagem %}
    <p>{{ mensagem }}</p>
{% endif %}

    <form method="POST" action="/login">

        <label>E-mail:</label>
        <input type="email" name="email">

        <br><br>

        <label>Senha:</label>
        <input type="password" name="senha">

        <br><br>

        <button type="submit">Entrar</button>

    </form>

</body>

</html>
